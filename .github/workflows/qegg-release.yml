name: QuailEgg Release
on:
  push:
    branches: ["main"]
    paths:
      - ".changes/**"
      - ".quailegg.toml"
      - ".quailegg/pre-release.lock"
      - ".quailegg/release.json"
      - "CHANGELOG.md"
      - "frontend/package.json"
      - "go.mod"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: qegg-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]'
    outputs:
      phase: ${{ steps.plan.outputs.phase }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - name: Install qegg
        run: go install github.com/SuperQuail/QuailEgg/cmd/qegg@latest
      - name: Plan
        id: plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          qegg plan --json > "$RUNNER_TEMP/plan.json"
          phase="$(jq -r .phase "$RUNNER_TEMP/plan.json")"
          case "$phase" in
            none|version|publish) ;;
            *) echo "unexpected phase: $phase" >&2; exit 1 ;;
          esac
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
  build-windows:
    needs: plan
    if: needs.plan.outputs.phase == 'publish'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: choco install nsis -y --no-progress
      - run: echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        shell: pwsh
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - run: wails build -platform windows/amd64 -nsis
      - name: Sign and repack Windows binaries
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX) { Write-Host 'no certificate configured, skipping code signing'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source }
          if (-not $signtool) { throw 'signtool.exe not found on this runner' }
          $app = 'build/bin/neobot-desktop.exe'
          if (-not (Test-Path $app)) { throw 'application binary not found' }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERT_PASSWORD $app
          if ($LASTEXITCODE -ne 0) { throw 'code signing failed: application binary' }
          # Repack the installer with the signed executable, then sign the installer itself.
          Push-Location build/windows/installer
          & makensis -DARG_WAILS_AMD64_BINARY=..\..\bin\neobot-desktop.exe project.nsi
          if ($LASTEXITCODE -ne 0) { throw 'repacking the installer failed' }
          Pop-Location
          $installer = 'build/bin/neobot-desktop-amd64-installer.exe'
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERT_PASSWORD $installer
          if ($LASTEXITCODE -ne 0) { throw "code signing failed: installer" }
          Remove-Item $pfx -Force
      - name: Generate checksums
        shell: pwsh
        run: |
          $installer = 'neobot-desktop-amd64-installer.exe'
          $hash = (Get-FileHash -LiteralPath "build/bin/$installer" -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
          "$hash  $installer" | Set-Content -LiteralPath build/bin/checksums.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: qegg-assets-windows
          if-no-files-found: error
          path: |
            build/bin/neobot-desktop-amd64-installer.exe
            build/bin/checksums.txt
  build-linux:
    needs: plan
    if: needs.plan.outputs.phase == 'publish'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - run: wails build -platform linux/amd64 -tags webkit2_41
      - run: ./build/linux/package.sh
      - name: Generate Linux checksums
        run: cd build/bin && sha256sum neobot-desktop-linux-amd64.tar.gz > checksums-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qegg-assets-linux
          if-no-files-found: error
          path: |
            build/bin/neobot-desktop-linux-amd64.tar.gz
            build/bin/checksums-linux.txt
  version:
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.plan.outputs.phase == 'version'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - name: Install qegg
        run: go install github.com/SuperQuail/QuailEgg/cmd/qegg@latest
      - name: Release
        run: qegg release --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    needs:
      - plan
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.plan.outputs.phase == 'publish'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - name: Install qegg
        run: go install github.com/SuperQuail/QuailEgg/cmd/qegg@latest
      - uses: actions/download-artifact@v4
        with:
          pattern: qegg-assets-*
          path: .quailegg/assets/downloaded
      - name: Release
        run: qegg release --yes --assets-dir .quailegg/assets/downloaded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
